services:
  app:
    image: php:8.4-fpm
    container_name: workflow-analytics-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    environment:
      - APP_ENV=local
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    depends_on:
      - node
    networks:
      - workflow-network

  nginx:
    image: nginx:alpine
    container_name: workflow-analytics-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - workflow-network

  node:
    image: node:22-alpine
    container_name: workflow-analytics-node
    working_dir: /var/www
    command: sh -c "npm install && npm install @rolldown/binding-linux-x64-musl lightningcss-linux-x64-musl && chmod +x node_modules/.bin/* && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www
    networks:
      - workflow-network

networks:
  workflow-network:
    driver: bridge
