services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: workflow-analytics-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      - node
    networks:
      - workflow-network

  nginx:
    image: nginx:alpine
    container_name: workflow-analytics-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - workflow-network

  node:
    image: node:22-alpine
    container_name: workflow-analytics-node
    working_dir: /var/www
    command: sh -c "npm install && npm install @rolldown/binding-linux-x64-musl lightningcss-linux-x64-musl && chmod +x node_modules/.bin/* && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www
    networks:
      - workflow-network

  db:
    image: postgres:17-alpine
    container_name: workflow-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-workflow_analytics}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_LOCAL:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workflow-network

volumes:
  postgres_data:

networks:
  workflow-network:
    driver: bridge
